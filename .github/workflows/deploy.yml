name: Despliegue Astro Daikan Dojo

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Desplegar por FTP
    needs: ci # solo se publica si build y tests pasan
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://daikandojo.es
    steps:
      - name: 📥 Descargar build verificado
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: 🚀 Subir a Carpeta de Dominio
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          protocol: ftp
          port: 21
