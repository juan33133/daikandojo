name: CI

on:
  push:
    branches-ignore: [main] # en main la CI la ejecuta deploy.yml
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Tests (unitarios, datos y auditoría SEO) + cobertura
        run: npx vitest run --coverage --reporter=default --reporter=github-actions

      - name: Resumen de cobertura
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = k => `| ${k} | ${t[k].pct}% |`;
            console.log(["### Cobertura de src/lib", "| Métrica | % |", "|---|---|",
              ...["lines","statements","functions","branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Auditoría Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
